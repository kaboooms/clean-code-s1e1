<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen">
</head>
<body>
<header class="header">
  <img class="header__image" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix">
  <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
</header>
<main class="main">

  <!--  Task input section  -->
  <section class="task-section task-section__input">
    <h3 class="task-section__title">Add Item</h3>
    <div class="task-item">
      <input id="new-task" class="task-section__input-text" type="text">
      <button class="task-section__button">Add</button>
    </div>
  </section>

  <!--  Incomplete tasks  -->
  <section class="task-section">
    <h3 class="task-section__title">Todo</h3>
    <ul class="task-list task-list--incompleted">
      <li class="task-item">
        <input class="task-item__checkbox" type="checkbox">
        <label class="task-item__label">Pay Bills</label>
        <input class="task-item__input-text" type="text">
        <button class="task-item__button task-item__button--edit">Edit</button>
        <button class="task-item__button task-item__button--delete">
          <img src="./remove.svg" alt="remove task">
        </button>
      </li>
      <li class="task-item task-item--editing">
        <input class="task-item__checkbox" type="checkbox">
        <label class="task-item__label">Go Shopping</label>
        <input class="task-item__input-text" type="text" value="Go Shopping">
        <button class="task-item__button task-item__button--edit">Save</button>
        <button class="task-item__button task-item__button--delete">
          <img src="./remove.svg" alt="remove task">
        </button>
      </li>
    </ul>
  </section>

  <!--  Completed tasks  -->
  <section class="task-section">
    <h3 class="task-section__title">Completed</h3>
    <ul class="task-list task-list--completed">
      <li class="task-item">
        <input class="task-item__checkbox" type="checkbox" checked>
        <label class="task-item__label">See the Doctor</label>
        <input class="task-item__input-text" type="text">
        <button class="task-item__button task-item__button--edit">Edit</button>
        <button class="task-item__button task-item__button--delete">
          <img src="./remove.svg" alt="remove task">
        </button>
      </li>
    </ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
