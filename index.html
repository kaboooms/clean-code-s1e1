<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen">
</head>
<body>
<header class="header">
  <img class="header__image" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix">
  <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
</header>
<main class="main">

  <!--  Task input section  -->
  <section class="task-section task-section__input" id="task-input">
    <label class="task-section__title" for="new-task">Add Item</label>
    <div class="task-list__item">
      <input id="new-task" class="task task__input" type="text">
      <button class="button task-input__btn">Add</button>
    </div>
  </section>

  <!--  Incomplete tasks  -->
  <section class="task-section task-section__incompleted">
    <h3 class="task-section__title">Todo</h3>
    <ul class="task-list" id="incomplete-tasks">
      <li class="task-list__item">
        <input class="checkbox" type="checkbox">
        <label class="task">Pay Bills</label>
        <input type="text" class="task input-text">
        <button class="button edit">Edit</button>
        <button class="button delete">
          <img src="./remove.svg" alt="Remove">
        </button>
      </li>
      <li class="task-list__item edit-mode">
        <input type="checkbox">
        <label class="task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task input-text">
        <button class="button edit">Save</button>
        <button class="button delete">
          <img src="./remove.svg" alt="Remove">
        </button>
      </li>
    </ul>
  </section>

  <!--  Completed tasks  -->
  <section class="task-section task-section__completed">
    <h3 class="task-section__title">Completed</h3>
    <ul class="task-list" id="completed-tasks">
      <li class="task-list__item">
        <input type="checkbox" checked>
        <label class="task">See the Doctor</label>
        <input type="text" class="task input-text">
        <button class="button edit">Edit</button>
        <button class="button delete">
          <img src="./remove.svg" alt="Remove">
        </button>
      </li>
    </ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
